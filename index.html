<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUNAR RELAY OS - Mission Continuity Intelligence</title>
    <meta name="description" content="Mission Continuity Intelligence for the Lunar South Pole — Autonomous Lunar Relay Network, Route Optimization, Power Margins, and Failure Re-planning." />
    <meta property="og:title" content="LUNAR RELAY OS" />
    <meta property="og:description" content="Mission Continuity Intelligence for the Lunar South Pole" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('lunar_relay_theme');
          if (t === 'hc' || t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg text-text antialiased selection:bg-accent selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
